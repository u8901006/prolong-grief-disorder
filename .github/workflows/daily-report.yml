name: PGD Daily Literature Report

on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
          echo "Date: $(grep target "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Fetch papers from PubMed
        run: node scripts/fetch-papers.mjs
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}
          LOOKBACK_DAYS: "7"
          MAX_PAPERS: "40"
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(node -e "const d=require('./papers.json'); console.log(d.count||0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            node -e "
              const fs=require('fs');
              fs.writeFileSync('papers.json', JSON.stringify({
                date: '${{ steps.date.outputs.target }}',
                count: 0,
                papers: []
              }));
            "
            echo "No papers found, will generate empty report"
          fi

      - name: Generate report with NVIDIA Nemotron
        run: node scripts/generate-report.mjs
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target }}
          INPUT_FILE: papers.json
          OUTPUT_DIR: docs

      - name: Generate index page
        run: node scripts/generate-index.mjs
        env:
          REPORTS_DIR: docs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📄 PGD daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        run: |
          echo "### 📄 PGD Daily Literature Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [pgd-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/prolong-grief-disorder/pgd-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
